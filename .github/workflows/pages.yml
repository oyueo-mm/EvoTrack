name: Deploy EvoTrack to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  PLAYWRIGHT_CHANNEL: chrome
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Matched-seed GA and PPO performance comparison
        run: |
          git fetch --no-tags --depth=1 origin b50732fe87bc5f06de43c60088d40d926cd8013b
          git worktree add --detach .cache/learning-baseline b50732fe87bc5f06de43c60088d40d926cd8013b
          cp scripts/benchmark-learning-v06.ts .cache/learning-baseline/scripts/benchmark-learning-v06.ts
          ./node_modules/.bin/tsx .cache/learning-baseline/scripts/benchmark-learning-v06.ts .cache/learning-baseline-results.json
          npm run bench:learning -- .cache/learning-candidate-results.json
          node scripts/compare-learning-v06.mjs .cache/learning-baseline-results.json .cache/learning-candidate-results.json
      - name: Keep learning comparison records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-comparison
          path: |
            .cache/learning-baseline-results.json
            .cache/learning-candidate-results.json
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - name: Verify public Pages website
        run: npm run test:e2e
        env:
          EVOTRACK_BASE_URL: https://oyueo-mm.github.io/EvoTrack/
      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-verification
          include-hidden-files: true
          retention-days: 7
          path: |
            .cache/deployment-qa/
            .cache/ui-review/
            .cache/live-population-performance.json
            .cache/ppo-observation-performance.json
            test-results/
